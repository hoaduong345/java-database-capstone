<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="icon"
      type="image/png"
      th:href="@{/assets/images/logo/logo.png}"
    />
    <title>Doctor Dashboard | Hospital CMS</title>
    <link
      rel="stylesheet"
      th:href="@{/assets/css/style.css}"
    />
    <link
      rel="stylesheet"
      th:href="@{/assets/css/adminDashboard.css}"
    />
    <link
      rel="stylesheet"
      th:href="@{/assets/css/doctorDashboard.css}"
    />
    <script
      th:src="@{/js/util.js}"
      defer
    ></script>
    <script
      th:src="@{/js/render.js}"
      defer
    ></script>
    <script
      th:src="@{/js/components/header.js}"
      defer
    ></script>
    <script
      th:src="@{/js/components/footer.js}"
      defer
    ></script>
    <script
      type="module"
      th:src="@{/js/doctorDashboard.js}"
      defer
    ></script>
  </head>

  <body onload="renderContent()">
    <div class="container">
      <div class="wrapper">
        <div id="header"></div>
        <main class="main-content">
          <div class="appointment-heading">
            <div>
              <p class="eyebrow">Doctor workspace</p>
              <h1>Patient Appointments</h1>
            </div>
            <div class="appointment-controls">
              <button
                type="button"
                id="todayButton"
                class="today-btn"
              >
                Today
              </button>
              <label
                class="visually-hidden"
                for="datePicker"
                >Choose appointment date</label
              >
              <input
                type="date"
                id="datePicker"
                class="date-picker"
              />
            </div>
          </div>
          <label
            class="visually-hidden"
            for="searchBar"
            >Search patients</label
          >
          <input
            type="search"
            id="searchBar"
            class="searchBar"
            placeholder="Search patients by name"
          />
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th scope="col">Patient ID</th>
                  <th scope="col">Name</th>
                  <th scope="col">Phone No.</th>
                  <th scope="col">Email</th>
                  <th scope="col">Prescription</th>
                </tr>
              </thead>
              <tbody id="patientTableBody"></tbody>
            </table>
          </div>
        </main>
        <div id="footer"></div>
      </div>
    </div>
  </body>
</html>
