<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="icon"
      type="image/png"
      th:href="@{/assets/images/logo/logo.png}"
    />
    <title>Admin Dashboard | Hospital CMS</title>
    <link
      rel="stylesheet"
      th:href="@{/assets/css/style.css}"
    />
    <link
      rel="stylesheet"
      th:href="@{/assets/css/adminDashboard.css}"
    />
    <script
      th:src="@{/js/util.js}"
      defer
    ></script>
    <script
      th:src="@{/js/render.js}"
      defer
    ></script>
    <script
      th:src="@{/js/components/header.js}"
      defer
    ></script>
    <script
      th:src="@{/js/components/footer.js}"
      defer
    ></script>
    <script
      type="module"
      th:src="@{/js/adminDashboard.js}"
      defer
    ></script>
  </head>

  <body onload="renderContent()">
    <div class="container">
      <div class="wrapper">
        <div id="header"></div>
        <main class="main-content">
          <div class="dashboard-heading">
            <div>
              <p class="eyebrow">Administration</p>
              <h1>Doctor Directory</h1>
            </div>
            <button
              class="dashboard-btn"
              id="addDocBtn"
              type="button"
            >
              Add Doctor
            </button>
          </div>
          <div class="directory-controls">
            <label
              class="visually-hidden"
              for="searchBar"
              >Search doctors</label
            >
            <input
              type="search"
              id="searchBar"
              class="searchBar"
              placeholder="Search doctors by name"
            />
            <div class="filter-wrapper">
              <label
                class="visually-hidden"
                for="filterTime"
                >Filter by availability</label
              >
              <select
                class="filter-select"
                id="filterTime"
              >
                <option value="">All times</option>
                <option value="AM">AM</option>
                <option value="PM">PM</option>
              </select>
              <label
                class="visually-hidden"
                for="filterSpecialty"
                >Filter by specialty</label
              >
              <select
                class="filter-select"
                id="filterSpecialty"
              >
                <option value="">All specialties</option>
                <option value="Cardiologist">Cardiologist</option>
                <option value="Dermatologist">Dermatologist</option>
                <option value="Neurologist">Neurologist</option>
                <option value="Pediatrician">Pediatrician</option>
                <option value="Orthopedic">Orthopedic</option>
                <option value="Gynecologist">Gynecologist</option>
                <option value="Psychiatrist">Psychiatrist</option>
                <option value="Dentist">Dentist</option>
                <option value="Ophthalmologist">Ophthalmologist</option>
                <option value="Ent">ENT Specialist</option>
                <option value="Urologist">Urologist</option>
                <option value="Oncologist">Oncologist</option>
                <option value="Gastroenterologist">Gastroenterologist</option>
                <option value="General">General Physician</option>
              </select>
            </div>
          </div>
          <div
            id="content"
            aria-live="polite"
          ></div>
        </main>
        <div id="footer"></div>
      </div>
    </div>
    <div
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-content">
        <button
          class="close"
          id="closeModal"
          type="button"
          aria-label="Close dialog"
        >
          &times;
        </button>
        <div id="modal-body"></div>
      </div>
    </div>
    <script type="module">
      import { openModal } from "/js/components/modals.js";

      document
        .getElementById("addDocBtn")
        .addEventListener("click", () => openModal("addDoctor"));
    </script>
  </body>
</html>
