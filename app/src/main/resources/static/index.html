<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="icon"
      type="image/png"
      href="/assets/images/logo/logo.png"
    />
    <title>Select Your Role | Hospital CMS</title>
    <link
      rel="stylesheet"
      href="/assets/css/index.css"
    />
    <link
      rel="stylesheet"
      href="/assets/css/style.css"
    />
    <script
      src="/js/util.js"
      defer
    ></script>
    <script
      src="/js/render.js"
      defer
    ></script>
    <script
      src="/js/components/header.js"
      defer
    ></script>
    <script
      src="/js/components/footer.js"
      defer
    ></script>
  </head>

  <body>
    <div class="container">
      <div class="wrapper">
        <div id="header"></div>
        <main class="main-content">
          <section
            class="role-panel"
            aria-labelledby="role-heading"
          >
            <p class="eyebrow">Hospital CMS</p>
            <h1 id="role-heading">Select Your Role</h1>
            <p class="role-intro">Choose a portal to continue.</p>
            <div class="role-actions">
              <button
                class="role-button"
                type="button"
                onclick="selectRole('admin')"
              >
                Admin
              </button>
              <button
                class="role-button"
                type="button"
                onclick="selectRole('patient')"
              >
                Patient
              </button>
              <button
                class="role-button"
                type="button"
                onclick="selectRole('doctor')"
              >
                Doctor
              </button>
            </div>
          </section>
        </main>
        <div id="footer"></div>
      </div>
    </div>
    <div
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-content">
        <button
          class="close"
          id="closeModal"
          type="button"
          aria-label="Close dialog"
        >
          &times;
        </button>
        <div id="modal-body"></div>
      </div>
    </div>
  </body>
</html>
